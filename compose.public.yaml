services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: mysql-lab-web:latest
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      LAB_ACCESS_CODE: ${LAB_ACCESS_CODE:?Set LAB_ACCESS_CODE in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "0.0.0.0:${WEB_PORT:-28473}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
